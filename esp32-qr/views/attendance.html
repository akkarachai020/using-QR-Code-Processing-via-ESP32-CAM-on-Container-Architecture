<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>รายการลงเวลาเช็กชื่อ</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: #fff; padding: 20px; margin: 0; }
        .container { max-width: 1000px; margin: 0 auto; }
        .nav { margin-bottom: 20px; text-align: center; }
        .nav a { color: #38bdf8; text-decoration: none; margin: 0 15px; font-weight: bold; }
        .nav a:hover { text-decoration: underline; }
        .card { background: #1e293b; padding: 25px; border-radius: 12px; border: 1px solid #334155; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px; border-bottom: 1px solid #334155; text-align: center; font-size: 14px; }
        th { background: #334155; color: #38bdf8; }
        .qr-val { color: #22c55e; font-weight: bold; font-family: monospace; font-size: 16px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="nav">
            <a href="/">📷 สแกนสด Dashboard</a> | 
            <a href="/attendance">📋 หน้าแสดงการลงเวลา (Database)</a> | 
            <a href="http://localhost:8080" target="_blank">🗄️ phpMyAdmin</a>
        </div>
        <div class="card">
            <h2>📋 ตารางประวัติการลงเวลา (ดึงจาก MySQL)</h2>
            <table>
                <thead>
                    <tr>
                        <th>ลำดับ</th>
                        <th>รหัสนักศึกษา</th>
                        <th>ชื่อ</th>
                        <th>นามสกุล</th>
                        <th>วันที่ - เวลา บันทึกเข้าระบบ</th>
                    </tr>
                </thead>
                <tbody id="logsBody">
                    <tr><td colspan="5">กำลังโหลดข้อมูล...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
    <script>
        async function loadLogs() {
            try {
                const res = await fetch('/api/all-attendance');
                const data = await res.json();
                let html = '';
                if(data.length === 0) {
                    html = '<tr><td colspan="5">ยังไม่มีข้อมูลการลงเวลา</td></tr>';
                } else {
                    data.forEach((item, index) => {
                        html += `<tr>
                            <td>${index + 1}</td>
                            <td class="qr-val">${item.student_id}</td>
                            <td>${item.first_name}</td>
                            <td>${item.last_name}</td>
                            <td>${item.scan_time}</td>
                        </tr>`;
                    });
                }
                document.getElementById('logsBody').innerHTML = html;
            } catch(e){}
        }
        loadLogs();
        setInterval(loadLogs, 3000);
    </script>
</body>
</html>
